# Publica o site automaticamente no GitHub Pages
# sempre que houver alteração na branch "main".
name: Publicar site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar o repositório
        uses: actions/checkout@v4

      - name: Instalar o R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Instalar pacotes R
        run: Rscript -e 'install.packages(c("knitr", "rmarkdown"))'

      - name: Instalar o Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Gerar o site
        uses: quarto-dev/quarto-actions/render@v2

      - name: Preparar arquivos para o GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
