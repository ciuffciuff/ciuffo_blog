# CFF — Conscience Fast Forward · identidade visual (tema escuro)
meta:
  name:
    short: CFF
    full: Conscience Fast Forward

logo:
  images:
    mark: logo/cff-mark-reverse.svg
  small: mark
  medium: mark

color:
  palette:
    azul: "#6f97ff"
    verde: "#00d579"
    amarelo: "#ffd200"
    ink: "#f2f4fa"
    ink-muted: "#a3a9bd"
    surface: "#0b1233"
    surface-alt: "#141d45"
  background: surface
  foreground: ink
  primary: azul
  secondary: ink-muted
  success: verde
  info: azul
  warning: amarelo
  danger: "#ff6b6b"
  light: surface-alt
  dark: surface

typography:
  fonts:
    - family: Inter
      source: google
      weight: [400, 500, 600]
      style: [normal, italic]
    - family: Lexend
      source: google
      weight: [500]
  base:
    family: Inter
    weight: 400
    line-height: 1.65
  headings:
    family: Lexend
    weight: 500
    color: ink
  link:
    color: azul
    decoration: underline

defaults:
  bootstrap:
    defaults:
      navbar-bg: "#0b1233"
      navbar-fg: "#f2f4fa"
      navbar-hl: "#6f97ff"
      footer-bg: "#141d45"
